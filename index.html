<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lactobluster</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  background:#f6f5f1;
  color:#171717;
}

main{
  max-width:520px;
  margin:auto;
  padding:30px 18px 50px;
}

header{
  text-align:center;
  margin:10px 0 30px;
}

h1{
  font-size:42px;
  margin:0;
  font-weight:800;
  letter-spacing:-1.5px;
}

header p{
  color:#777;
  margin:8px 0 0;
}

button{
  width:100%;
  border:0;
  border-radius:18px;
  padding:18px;
  background:#111;
  color:white;
  font-size:18px;
  font-weight:700;
}

#reader{
  display:none;
  margin-top:20px;
  border-radius:20px;
  overflow:hidden;
  background:#111;
}

.message{
  margin-top:18px;
  text-align:center;
  color:#777;
}

.card{
  background:white;
  border-radius:22px;
  padding:20px;
  margin-top:20px;
  box-shadow:0 8px 30px rgba(0,0,0,.07);
}

.status{
  margin-top:20px;
  padding:20px;
  border-radius:18px;
  text-align:center;
}

.status .emoji{
  font-size:42px;
}

.status h2{
  margin:6px 0;
}

.green{
  background:#e8f7ed;
  color:#167a43;
}

.orange{
  background:#fff1dc;
  color:#b96b00;
}

.red{
  background:#fde9e9;
  color:#bd2525;
}

.error{
  color:#c62828;
  text-align:center;
  margin-top:18px;
}

.fallback{
  margin-top:20px;
  padding:18px;
  background:white;
  border-radius:20px;
}

.fallback input{
  width:100%;
  padding:14px;
  margin:12px 0;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:17px;
}

.secondary{
  background:#e9e9e9;
  color:#111;
  font-size:15px;
}

.small{
  text-align:center;
  color:#888;
  font-size:12px;
  margin-top:15px;
}
</style>
</head>

<body>

<main>

<header>
<h1>Lactobluster</h1>
<p>Scansiona. Controlla. Mangia tranquillo.</p>
</header>

<button id="start">
📷 SCANSIONA PRODOTTO
</button>

<div id="reader"></div>

<div id="message" class="message"></div>

<div id="result"></div>

<div class="fallback">

<strong>Non riesci a usare la fotocamera?</strong>

<input
id="ean"
inputmode="numeric"
placeholder="Inserisci il codice a barre"
>

<button id="search">
🔎 CERCA CODICE
</button>

</div>

</main>

<script>

let scanner = null;

const startButton =
document.getElementById("start");

const reader =
document.getElementById("reader");

const message =
document.getElementById("message");

const result =
document.getElementById("result");

const ean =
document.getElementById("ean");

const searchButton =
document.getElementById("search");


function escapeHTML(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");

}


function stopScanner(){

if(scanner){

try{

scanner.stop();

}catch(e){}

scanner = null;

}

reader.style.display="none";

startButton.style.display="block";

}


function analyzeProduct(product){

const ingredients =
(product.ingredients_text_it ||
product.ingredients_text ||
"").toLowerCase();

const allergens =
(product.allergens || "").toLowerCase();


if(/senza\s+lattosio|lactose[- ]?free/.test(ingredients)){

return {
className:"green",
emoji:"🟢",
title:"SENZA LATTOSIO",
text:"Il prodotto riporta una dicitura esplicita."
};

}


if(/lattosio|lactose/.test(ingredients)){

return {
className:"red",
emoji:"🔴",
title:"LATTOSIO RILEVATO",
text:"Negli ingredienti è presente un riferimento esplicito al lattosio."
};

}


if(
/latte|milk|siero|whey|caseina|casein|panna|cream|burro|butter/.test(ingredients)
||
/milk|latte/.test(allergens)
){

return {
className:"orange",
emoji:"🟠",
title:"DA VERIFICARE",
text:"Sono presenti latte o derivati."
};

}


return {
className:"green",
emoji:"🟢",
title:"NESSUN LATTOSIO RILEVATO",
text:"Non sono stati trovati riferimenti al lattosio."
};

}


async function searchProduct(code){

code = String(code || "")
.replace(/\D/g,"");

if(!code){

message.innerHTML =
'<div class="error">Inserisci un codice a barre valido.</div>';

return;

}


message.innerHTML =
"🔎 Sto cercando il prodotto...";

result.innerHTML="";


try{

const response = await fetch(

"https://world.openfoodfacts.org/api/v2/product/"
+
encodeURIComponent(code)
+
".json"

);

const data = await response.json();


if(data.status !== 1){

throw new Error("not-found");

}


const product = data.product;

const analysis =
analyzeProduct(product);

const name =
product.product_name_it ||
product.product_name ||
"Prodotto senza nome";

const brand =
product.brands || "";

const ingredients =
product.ingredients_text_it ||
product.ingredients_text ||
"Ingredienti non disponibili.";


result.innerHTML = `

<div class="card">

<h2>${escapeHTML(name)}</h2>

<p>${escapeHTML(brand)}</p>

<div class="status ${analysis.className}">

<div class="emoji">
${analysis.emoji}
</div>

<h2>
${analysis.title}
</h2>

<div>
${escapeHTML(analysis.text)}
</div>

</div>

<p>
<strong>Ingredienti:</strong>
</p>

<p>
${escapeHTML(ingredients)}
</p>

<div class="small">
Codice EAN: ${escapeHTML(code)}
<br>
Dati: Open Food Facts
</div>

</div>

`;

message.innerHTML="";


}catch(error){

message.innerHTML =
'<div class="error">❌ Prodotto non trovato.</div>';

}

}


async function startScanner(){

message.innerHTML =
"📷 Avvio fotocamera...";


reader.style.display="block";


try{

scanner =
new Html5Qrcode("reader");


await scanner.start(

{
facingMode:"environment"
},

{
fps:10,
qrbox:{
width:290,
height:130
}
},

decodedText => {

stopScanner();

searchProduct(decodedText);

},

errorMessage => {}

);


startButton.style.display="none";

message.innerHTML =
"📷 Inquadra il codice a barre";


}catch(error){

stopScanner();

message.innerHTML = `

<div class="error">

❌ Non riesco ad accedere alla fotocamera.

<div class="small">

Apri Lactobluster direttamente in Safari
e consenti l'accesso alla fotocamera.

</div>

</div>

`;

}

}


startButton.addEventListener(
"click",
startScanner
);


searchButton.addEventListener(
"click",
() => searchProduct(ean.value)
);


ean.addEventListener(
"keydown",
event => {

if(event.key === "Enter"){

searchProduct(ean.value);

}

}
);

</script>

</body>
</html>
