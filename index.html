<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Lactobluster</title>

<meta name="theme-color" content="#0b0d0f">

<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>

:root{
  --bg:#0b0d0f;
  --surface:#14171a;
  --surface2:#1b1f23;
  --border:#292e33;
  --text:#f5f5f2;
  --muted:#8e959b;
  --green:#79e27f;
  --green-dark:#173a20;
  --red:#ff6b6b;
  --red-dark:#3a1719;
  --yellow:#f2c94c;
  --radius:24px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  background:var(--bg);
}

body{
  margin:0;
  background:
    radial-gradient(circle at 50% -10%, #20252a 0%, var(--bg) 38%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,
              "SF Pro Display","SF Pro Text",Arial,sans-serif;
  min-height:100vh;
  padding:
    env(safe-area-inset-top)
    18px
    calc(28px + env(safe-area-inset-bottom));
}

.app{
  width:100%;
  max-width:520px;
  margin:auto;
}

/* HEADER */

header{
  padding:30px 4px 22px;
}

.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:29px;
  font-weight:800;
  letter-spacing:-1.4px;
}

.version{
  font-size:11px;
  color:#6f767c;
  background:#15181b;
  border:1px solid var(--border);
  padding:6px 9px;
  border-radius:20px;
}

.tagline{
  margin-top:7px;
  color:var(--muted);
  font-size:15px;
}

/* SCANNER */

.scanner-card{
  position:relative;
  overflow:hidden;
  height:235px;
  border-radius:30px;
  background:#050607;
  border:1px solid #24282c;
  box-shadow:0 18px 50px rgba(0,0,0,.35);
}

#reader{
  width:100%;
  height:100%;
}

.scan-ui{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.scan-frame{
  position:absolute;
  left:17%;
  right:17%;
  top:22%;
  bottom:22%;
  border:2px solid rgba(255,255,255,.8);
  border-radius:18px;
}

.scan-line{
  position:absolute;
  left:20%;
  right:20%;
  top:50%;
  height:2px;
  background:var(--green);
  box-shadow:0 0 14px var(--green);
  animation:scan 2.2s ease-in-out infinite;
}

@keyframes scan{
  0%,100%{transform:translateY(-55px);opacity:.45}
  50%{transform:translateY(55px);opacity:1}
}

.scanner-hint{
  position:absolute;
  bottom:14px;
  left:0;
  right:0;
  text-align:center;
  font-size:12px;
  color:#aeb4b8;
}

/* BUTTONS */

.primary{
  width:100%;
  margin-top:14px;
  height:58px;
  border:0;
  border-radius:18px;
  background:#f4f4f1;
  color:#090a0b;
  font-size:16px;
  font-weight:750;
  letter-spacing:-.2px;
  cursor:pointer;
}

.primary:active{
  transform:scale(.98);
}

.secondary{
  width:100%;
  margin-top:10px;
  height:48px;
  border:1px solid var(--border);
  border-radius:16px;
  background:var(--surface);
  color:var(--text);
  font-size:14px;
  font-weight:600;
}

/* MANUAL */

.manual{
  margin-top:14px;
  padding:15px;
  border-radius:20px;
  background:var(--surface);
  border:1px solid var(--border);
}

.manual-label{
  font-size:12px;
  color:var(--muted);
  margin-bottom:9px;
}

.manual-row{
  display:flex;
  gap:8px;
}

input{
  flex:1;
  min-width:0;
  height:48px;
  padding:0 14px;
  border-radius:14px;
  border:1px solid #30363b;
  background:#0d1012;
  color:var(--text);
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#6c747b;
}

.lookup{
  width:90px;
  border:0;
  border-radius:14px;
  background:#292e33;
  color:white;
  font-weight:700;
}

/* PRODUCT */

.product{
  margin-top:18px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:26px;
  overflow:hidden;
  box-shadow:0 15px 40px rgba(0,0,0,.22);
}

.product-top{
  display:flex;
  gap:15px;
  padding:17px;
}

.product-image{
  width:82px;
  height:82px;
  flex:none;
  border-radius:18px;
  object-fit:cover;
  background:#22272b;
}

.product-info{
  min-width:0;
  padding-top:2px;
}

.product-title{
  font-size:19px;
  line-height:1.12;
  font-weight:750;
  letter-spacing:-.4px;
}

.product-brand{
  margin-top:7px;
  font-size:13px;
  color:var(--muted);
}

/* STATUS */

.status{
  margin:0 17px 17px;
  padding:18px;
  border-radius:20px;
}

.status.good{
  background:var(--green-dark);
  border:1px solid #255d31;
}

.status.bad{
  background:var(--red-dark);
  border:1px solid #6b272b;
}

.status.unknown{
  background:#24251c;
  border:1px solid #514d27;
}

.status-head{
  display:flex;
  align-items:center;
  gap:11px;
}

.status-dot{
  width:12px;
  height:12px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 12px rgba(121,226,127,.5);
}

.bad .status-dot{
  background:var(--red);
  box-shadow:0 0 12px rgba(255,107,107,.4);
}

.unknown .status-dot{
  background:var(--yellow);
}

.status-title{
  font-size:18px;
  font-weight:800;
  letter-spacing:-.3px;
}

.status-text{
  margin-top:8px;
  font-size:13px;
  line-height:1.45;
  color:#b9c0c3;
}

/* DETAILS */

.details{
  padding:0 17px 18px;
}

.detail-title{
  font-size:13px;
  color:var(--muted);
  margin-bottom:8px;
}

.ingredients{
  font-size:14px;
  line-height:1.5;
}

.ean{
  margin-top:16px;
  font-size:11px;
  color:#656d73;
}

/* ALTERNATIVES */

.alternatives{
  margin:0 17px 18px;
  padding:16px;
  border-radius:20px;
  background:#101316;
  border:1px solid var(--border);
}

.alt-title{
  font-size:15px;
  font-weight:750;
}

.alt-subtitle{
  margin-top:4px;
  font-size:12px;
  color:var(--muted);
}

.alt-list{
  display:flex;
  gap:9px;
  margin-top:13px;
  overflow-x:auto;
}

.alt{
  min-width:135px;
  padding:11px;
  border-radius:15px;
  background:#191d20;
  border:1px solid #292e33;
}

.alt-name{
  font-size:12px;
  font-weight:650;
}

.alt-note{
  margin-top:4px;
  font-size:10px;
  color:#7f888e;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:28px 15px;
  color:var(--muted);
  font-size:13px;
}

.hidden{
  display:none!important;
}

/* FOOTER */

footer{
  padding:22px 4px 5px;
  text-align:center;
  color:#555d62;
  font-size:10px;
}

</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">
    <div class="logo">Lactobluster</div>
    <div class="version">BETA</div>
  </div>

  <div class="tagline">
    Scansiona. Controlla. Mangia tranquillo.
  </div>
</header>

<!-- SCANNER -->

<div class="scanner-card">
  <div id="reader"></div>

  <div class="scan-ui">
    <div class="scan-frame"></div>
    <div class="scan-line"></div>
    <div class="scanner-hint">
      Inquadra il codice a barre
    </div>
  </div>
</div>

<button class="primary" id="scanButton">
  SCANSIONA PRODOTTO
</button>

<!-- MANUAL -->

<div class="manual">

  <div class="manual-label">
    Oppure inserisci manualmente il codice EAN
  </div>

  <div class="manual-row">

    <input
      id="eanInput"
      inputmode="numeric"
      placeholder="es. 8007290000477"
    >

    <button class="lookup" id="lookupButton">
      CERCA
    </button>

  </div>

</div>

<!-- PRODUCT -->

<div id="productCard" class="product hidden">

  <div class="product-top">

    <img
      id="productImage"
      class="product-image"
      alt="Immagine prodotto"
    >

    <div class="product-info">

      <div id="productTitle" class="product-title">
        —
      </div>

      <div id="productBrand" class="product-brand">
        —
      </div>

    </div>

  </div>

  <div id="statusBox" class="status good">

    <div class="status-head">

      <div class="status-dot"></div>

      <div id="statusTitle" class="status-title">
        —
      </div>

    </div>

    <div id="statusText" class="status-text">
      —
    </div>

  </div>

  <div class="details">

    <div class="detail-title">
      Ingredienti
    </div>

    <div id="ingredients" class="ingredients">
      —
    </div>

    <div id="ean" class="ean">
      —
    </div>

  </div>

  <div id="alternatives" class="alternatives hidden">

    <div class="alt-title">
      Potrebbero interessarti
    </div>

    <div class="alt-subtitle">
      Alternative dello stesso tipo senza lattosio.
    </div>

    <div class="alt-list" id="altList"></div>

  </div>

</div>

<div id="empty" class="empty">
  Cerca un prodotto per iniziare.
</div>

<footer>
  Dati alimentari forniti da Open Food Facts
</footer>

</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>

const API =
  "https://world.openfoodfacts.org/api/v2/product/";

const productCard =
  document.getElementById("productCard");

const empty =
  document.getElementById("empty");

const scanner =
  new Html5Qrcode("reader");

let scannerRunning = false;


/* -------------------------
   OPEN PRODUCT
------------------------- */

async function loadProduct(ean){

  if(!ean) return;

  empty.classList.add("hidden");

  try{

    const response =
      await fetch(API + encodeURIComponent(ean) + ".json");

    const data =
      await response.json();

    if(
      data.status !== 1 ||
      !data.product
    ){
      showNotFound(ean);
      return;
    }

    renderProduct(data.product, ean);

  }catch(error){

    showError();

  }

}


/* -------------------------
   RENDER
------------------------- */

function renderProduct(p, ean){

  productCard.classList.remove("hidden");

  const image =
    p.image_front_small_url ||
    p.image_front_url ||
    p.image_url ||
    "";

  const title =
    p.product_name_it ||
    p.product_name ||
    "Prodotto senza nome";

  const brand =
    p.brands ||
    "Marca non disponibile";

  const ingredients =
    p.ingredients_text_it ||
    p.ingredients_text ||
    "Ingredienti non disponibili.";

  document.getElementById("productTitle")
    .textContent = title;

  document.getElementById("productBrand")
    .textContent = brand;

  document.getElementById("ingredients")
    .textContent = ingredients;

  document.getElementById("ean")
    .textContent = "EAN " + ean;

  const img =
    document.getElementById("productImage");

  if(image){

    img.src = image;
    img.classList.remove("hidden");

  }else{

    img.classList.add("hidden");

  }


  /* -------------------------
     LACTOSE DETECTION
  ------------------------- */

  const ingredientsLower =
    ingredients.toLowerCase();

  const allergens =
    (p.allergens_tags || []).join(" ").toLowerCase();

  const traces =
    (p.traces_tags || []).join(" ").toLowerCase();

  const lactoseWords = [
    "latte",
    "lattosio",
    "latte in polvere",
    "siero di latte",
    "proteine del latte",
    "caseina",
    "caseinati",
    "panna",
    "burro",
    "milk",
    "lactose",
    "whey"
  ];

  const containsLactose =
    lactoseWords.some(word =>
      ingredientsLower.includes(word)
    ) ||
    allergens.includes("milk");


  const box =
    document.getElementById("statusBox");

  const statusTitle =
    document.getElementById("statusTitle");

  const statusText =
    document.getElementById("statusText");

  box.className = "status";


  if(containsLactose){

    box.classList.add("bad");

    statusTitle.textContent =
      "POSSIBILE LATTOSIO";

    statusText.textContent =
      "Sono presenti ingredienti o riferimenti al latte. Controlla sempre l'etichetta del prodotto.";

    showAlternatives(p);

  }else{

    box.classList.add("good");

    statusTitle.textContent =
      "LATTOSIO NON RILEVATO";

    statusText.textContent =
      "Negli ingredienti disponibili non sono stati trovati riferimenti evidenti a lattosio o derivati del latte.";

    document
      .getElementById("alternatives")
      .classList.add("hidden");

  }

}


/* -------------------------
   ALTERNATIVES
------------------------- */

function showAlternatives(product){

  const box =
    document.getElementById("alternatives");

  const list =
    document.getElementById("altList");

  list.innerHTML = "";

  const categories =
    product.categories_tags || [];

  const category =
    categories.length
      ? categories[categories.length - 1]
      : "";

  if(!category){

    box.classList.add("hidden");
    return;

  }

  const suggestions = [
    "Versione senza lattosio",
    "Prodotto lactose free",
    "Alternativa vegetale"
  ];

  suggestions.forEach(name => {

    const div =
      document.createElement("div");

    div.className = "alt";

    div.innerHTML = `
      <div class="alt-name">${name}</div>
      <div class="alt-note">Cerca alternative simili</div>
    `;

    list.appendChild(div);

  });

  box.classList.remove("hidden");

}


/* -------------------------
   NOT FOUND
------------------------- */

function showNotFound(ean){

  productCard.classList.add("hidden");

  empty.classList.remove("hidden");

  empty.innerHTML = `
    <strong>Prodotto non trovato</strong><br><br>
    EAN ${ean}<br><br>
    Prova a controllare il codice oppure inseriscilo di nuovo.
  `;

}


/* -------------------------
   ERROR
------------------------- */

function showError(){

  productCard.classList.add("hidden");

  empty.classList.remove("hidden");

  empty.innerHTML = `
    <strong>Impossibile recuperare il prodotto</strong><br><br>
    Controlla la connessione e riprova.
  `;

}


/* -------------------------
   MANUAL SEARCH
------------------------- */

document
  .getElementById("lookupButton")
  .addEventListener("click", () => {

    const ean =
      document
        .getElementById("eanInput")
        .value
        .replace(/\D/g,"");

    if(ean.length >= 8){

      loadProduct(ean);

    }

  });


document
  .getElementById("eanInput")
  .addEventListener("keydown", e => {

    if(e.key === "Enter"){

      document
        .getElementById("lookupButton")
        .click();

    }

  });


/* -------------------------
   SCANNER
------------------------- */

document
  .getElementById("scanButton")
  .addEventListener("click", async () => {

    if(scannerRunning) return;

    try{

      await scanner.start(

        {
          facingMode:"environment"
        },

        {
          fps:10,
          qrbox:{
            width:280,
            height:120
          },
          aspectRatio:1.777
        },

        decodedText => {

          scanner.stop()
            .then(() => {

              scannerRunning = false;

              document
                .getElementById("eanInput")
                .value = decodedText;

              loadProduct(decodedText);

            });

        },

        () => {}

      );

      scannerRunning = true;

      document
        .getElementById("scanButton")
        .textContent =
        "SCANSIONE ATTIVA…";

    }catch(error){

      alert(
        "Per usare la fotocamera devi consentire l'accesso alla fotocamera."
      );

    }

  });

</script>

</body>
</html>
