<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Lactobluster</title>

<meta name="theme-color" content="#0b0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lactobluster">

<link rel="icon"
      type="image/png"
      href="7B254A2F-7F3E-4478-B693-CF04829425F8.png">

<link rel="apple-touch-icon"
      href="7B254A2F-7F3E-4478-B693-CF04829425F8.png">

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
:root {
    --bg: #09090c;
    --card: #111116;
    --card2: #17171d;
    --text: #f5f5f7;
    --muted: #8e8e98;
    --border: #292930;

    --green: #39e879;
    --green-soft: rgba(57,232,121,.12);

    --red: #ff5c67;
    --red-soft: rgba(255,92,103,.12);

    --yellow: #ffc857;
    --yellow-soft: rgba(255,200,87,.12);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at 50% -10%, #1b1b22 0%, var(--bg) 42%);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Helvetica,
        Arial,
        sans-serif;
}

.container {
    width: min(100%, 760px);
    margin: auto;
    padding:
        max(28px, env(safe-area-inset-top))
        20px
        50px;
}

/* HEADER */

.header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 55px;
}

.app-icon {
    width: 52px;
    height: 52px;
    border-radius: 15px;
    object-fit: cover;
    flex-shrink: 0;
    background: #1b1b21;
    border: 1px solid #303039;
}

.brand {
    min-width: 0;
}

.brand h1 {
    margin: 0;
    font-size: 29px;
    line-height: 1;
    font-weight: 750;
    letter-spacing: -1.2px;
}

.brand p {
    margin: 7px 0 0;
    color: var(--muted);
    font-size: 15px;
}

/* HERO */

.hero {
    margin-bottom: 32px;
}

.hero h2 {
    margin: 0;
    font-size: clamp(48px, 13vw, 82px);
    line-height: .9;
    letter-spacing: -4px;
    font-weight: 800;
}

.hero h2 span {
    display: block;
}

.hero p {
    margin: 25px 0 0;
    max-width: 610px;
    color: var(--muted);
    font-size: 19px;
    line-height: 1.45;
}

/* BUTTON */

.scan-button {
    width: 100%;
    border: 0;
    border-radius: 22px;
    padding: 22px 24px;

    background: #f5f5f7;
    color: #09090c;

    font-size: 19px;
    font-weight: 750;
    letter-spacing: -.3px;

    cursor: pointer;
    transition: transform .15s ease, opacity .15s ease;
}

.scan-button:active {
    transform: scale(.98);
    opacity: .88;
}

.scan-button span {
    margin-right: 9px;
}

/* SCANNER */

.scanner-card {
    display: none;
    margin-top: 22px;
    overflow: hidden;

    background: #101014;
    border: 1px solid var(--border);
    border-radius: 24px;
}

.scanner-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 20px;
}

.scanner-title {
    font-size: 17px;
    font-weight: 700;
}

.close {
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 50%;
    background: #25252c;
    color: white;
    font-size: 25px;
}

#reader {
    width: 100%;
}

#reader video {
    width: 100% !important;
    height: auto !important;
}

#reader__dashboard {
    display: none !important;
}

/* RESULT */

.result {
    margin-top: 24px;
}

.product-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 28px;
    overflow: hidden;
}

.product-head {
    display: flex;
    gap: 18px;
    padding: 22px;
    align-items: center;
}

.product-image {
    width: 100px;
    height: 100px;
    object-fit: contain;
    border-radius: 18px;
    background: #f4f4f4;
    flex-shrink: 0;
}

.product-info h3 {
    margin: 0;
    font-size: 25px;
    line-height: 1.05;
    letter-spacing: -.8px;
}

.product-brand {
    margin-top: 8px;
    color: var(--muted);
    font-size: 15px;
}

/* STATUS */

.status {
    margin: 0 22px 22px;
    padding: 27px 20px;
    border-radius: 22px;
    text-align: center;
}

.status-icon {
    width: 14px;
    height: 14px;
    margin: 0 auto 17px;
    border-radius: 50%;
}

.status h4 {
    margin: 0;
    font-size: 25px;
    letter-spacing: -.6px;
}

.status p {
    margin: 11px auto 0;
    max-width: 500px;
    color: inherit;
    opacity: .75;
    font-size: 16px;
    line-height: 1.45;
}

.safe {
    background: var(--green-soft);
    color: var(--green);
}

.safe .status-icon {
    background: var(--green);
    box-shadow: 0 0 20px rgba(57,232,121,.55);
}

.danger {
    background: var(--red-soft);
    color: var(--red);
}

.danger .status-icon {
    background: var(--red);
    box-shadow: 0 0 20px rgba(255,92,103,.45);
}

.warning {
    background: var(--yellow-soft);
    color: var(--yellow);
}

.warning .status-icon {
    background: var(--yellow);
}

/* DETAILS */

.details {
    padding: 0 22px 25px;
}

.detail-title {
    margin: 0 0 9px;
    font-size: 18px;
    font-weight: 700;
}

.ingredients {
    color: var(--muted);
    line-height: 1.5;
    font-size: 16px;
}

/* ALTERNATIVES */

.alternatives {
    margin-top: 18px;
    padding: 22px;

    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 22px;
}

.alternatives h3 {
    margin: 0;
    font-size: 19px;
}

.alternatives p {
    color: var(--muted);
    line-height: 1.45;
    margin: 9px 0 18px;
}

.alt-list {
    display: grid;
    gap: 10px;
}

.alt {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 14px 16px;

    background: #202027;
    border-radius: 15px;
}

.alt strong {
    font-size: 15px;
}

.alt span {
    color: var(--green);
    font-size: 13px;
    font-weight: 700;
}

/* MANUAL */

.manual {
    margin-top: 24px;
    padding: 23px;

    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
}

.manual h3 {
    margin: 0 0 15px;
    font-size: 19px;
}

.manual input {
    width: 100%;
    padding: 17px 16px;

    background: #19191f;
    color: white;

    border: 1px solid #34343d;
    border-radius: 15px;

    font-size: 17px;
    outline: none;
}

.manual input:focus {
    border-color: #666671;
}

.manual button {
    width: 100%;
    margin-top: 10px;
    padding: 16px;

    border: 0;
    border-radius: 15px;

    background: #27272f;
    color: white;

    font-size: 16px;
    font-weight: 700;
}

/* LOADING */

.loading {
    display: none;
    text-align: center;
    padding: 35px;
    color: var(--muted);
}

.spinner {
    width: 28px;
    height: 28px;
    margin: 0 auto 14px;

    border: 3px solid #303039;
    border-top-color: var(--green);
    border-radius: 50%;

    animation: spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.error {
    margin-top: 20px;
    padding: 18px;
    border-radius: 18px;

    background: var(--red-soft);
    color: var(--red);

    line-height: 1.45;
}

/* MOBILE */

@media (max-width: 520px) {

    .container {
        padding-left: 16px;
        padding-right: 16px;
    }

    .header {
        margin-bottom: 45px;
    }

    .hero h2 {
        letter-spacing: -3px;
    }

    .hero p {
        font-size: 17px;
    }

    .product-head {
        align-items: flex-start;
    }

    .product-image {
        width: 82px;
        height: 82px;
    }

    .product-info h3 {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <header class="header">

        <img
            class="app-icon"
            src="7B254A2F-7F3E-4478-B693-CF04829425F8.png"
            alt="Lactobluster">

        <div class="brand">
            <h1>Lactobluster</h1>
            <p>Controllo intelligente del lattosio</p>
        </div>

    </header>


    <!-- HERO -->
    <section class="hero">

        <h2>
            <span>Scansiona.</span>
            <span>Controlla.</span>
        </h2>

        <p>
            Scopri in pochi secondi se un prodotto
            contiene lattosio o derivati del latte.
        </p>

    </section>


    <!-- SCAN BUTTON -->
    <button class="scan-button" onclick="openScanner()">
        <span>⌁</span> SCANSIONA PRODOTTO
    </button>


    <!-- SCANNER -->
    <section class="scanner-card" id="scannerCard">

        <div class="scanner-top">

            <div class="scanner-title">
                Inquadra il codice a barre
            </div>

            <button class="close" onclick="closeScanner()">
                ×
            </button>

        </div>

        <div id="reader"></div>

    </section>


    <!-- LOADING -->
    <div class="loading" id="loading">

        <div class="spinner"></div>

        Sto controllando il prodotto…

    </div>


    <!-- RESULT -->
    <div class="result" id="result"></div>


    <!-- MANUAL -->
    <section class="manual">

        <h3>Inserisci un codice manualmente</h3>

        <input
            id="barcodeInput"
            type="tel"
            inputmode="numeric"
            placeholder="Es. 8007290000477">

        <button onclick="manualSearch()">
            Cerca prodotto
        </button>

    </section>

</div>


<script>

let scanner = null;


/* =========================
   SCANNER
========================= */

function openScanner() {

    const card = document.getElementById("scannerCard");

    card.style.display = "block";

    if (scanner) return;

    scanner = new Html5Qrcode("reader");

    scanner.start(
        { facingMode: "environment" },

        {
            fps: 10,
            qrbox: {
                width: 280,
                height: 150
            }
        },

        barcode => {

            scanner.stop().then(() => {

                scanner.clear();
                scanner = null;

                card.style.display = "none";

                searchProduct(barcode);

            });

        },

        () => {}
    )
    .catch(error => {

        console.error(error);

        document.getElementById("reader").innerHTML =
            '<div style="padding:25px;color:#ff5c67;text-align:center">' +
            'Impossibile accedere alla fotocamera.<br>' +
            'Usa il campo per inserire il codice manualmente.' +
            '</div>';

    });
}


function closeScanner() {

    const card = document.getElementById("scannerCard");

    if (scanner) {

        scanner.stop()
            .then(() => {

                scanner.clear();
                scanner = null;
                card.style.display = "none";

            })
            .catch(() => {

                scanner = null;
                card.style.display = "none";

            });

    } else {

        card.style.display = "none";

    }
}


/* =========================
   MANUAL
========================= */

function manualSearch() {

    const input =
        document.getElementById("barcodeInput");

    const code =
        input.value.trim();

    if (!code) return;

    searchProduct(code);
}


/* =========================
   OPEN FOOD FACTS
========================= */

async function searchProduct(barcode) {

    const loading =
        document.getElementById("loading");

    const result =
        document.getElementById("result");

    loading.style.display = "block";
    result.innerHTML = "";

    try {

        const response = await fetch(
            `https://world.openfoodfacts.org/api/v2/product/${barcode}.json`
        );

        const data = await response.json();

        if (
            data.status !== 1 ||
            !data.product
        ) {

            throw new Error(
                "Prodotto non trovato."
            );

        }

        showProduct(
            data.product,
            barcode
        );

    }

    catch(error) {

        result.innerHTML = `
            <div class="error">
                <strong>Prodotto non trovato</strong><br><br>
                Non abbiamo trovato questo codice nel database.
                Puoi provare a inserirlo nuovamente oppure
                aggiungere manualmente il prodotto.
            </div>
        `;

    }

    finally {

        loading.style.display = "none";

    }
}


/* =========================
   PRODUCT
========================= */

function showProduct(product, barcode) {

    const result =
        document.getElementById("result");

    const name =
        product.product_name_it ||
        product.product_name ||
        "Prodotto senza nome";

    const brand =
        product.brands ||
        "Marca non disponibile";

    const image =
        product.image_front_small_url ||
        product.image_front_url ||
        product.image_url ||
        "";

    const ingredients =
        product.ingredients_text_it ||
        product.ingredients_text ||
        "Ingredienti non disponibili.";

    const tags = [

        ...(product.ingredients_analysis_tags || []),
        ...(product.allergens_tags || [])

    ].map(x => x.toLowerCase());


    const lactoseDetected =
        tags.some(tag =>
            tag.includes("lactose") ||
            tag.includes("milk") ||
            tag.includes("latte")
        );


    const ingredientsLower =
        ingredients.toLowerCase();


    const lactoseTextDetected =
        /lattosio|latte|siero di latte|caseina|caseinato|burro|panna|formaggio|milk|lactose/.test(
            ingredientsLower
        );


    let statusClass;
    let statusTitle;
    let statusText;


    if (lactoseDetected || lactoseTextDetected) {

        statusClass = "danger";

        statusTitle =
            "LATTOSIO O DERIVATI RILEVATI";

        statusText =
            "Sono presenti ingredienti o riferimenti compatibili con latte o derivati del latte.";

    }

    else if (
        product.ingredients_text ||
        product.ingredients_analysis_tags
    ) {

        statusClass = "safe";

        statusTitle =
            "LATTOSIO NON RILEVATO";

        statusText =
            "Negli ingredienti disponibili non sono stati trovati riferimenti a lattosio o derivati del latte.";

    }

    else {

        statusClass = "warning";

        statusTitle =
            "DATI INSUFFICIENTI";

        statusText =
            "Non ci sono abbastanza informazioni per verificare con sicurezza la presenza di lattosio.";

    }


    result.innerHTML = `

        <article class="product-card">

            <div class="product-head">

                ${
                    image
                    ?
                    `<img
                        class="product-image"
                        src="${image}"
                        alt="${escapeHtml(name)}"
                        onerror="this.style.display='none'"
                    >`
                    :
                    ""
                }

                <div class="product-info">

                    <h3>
                        ${escapeHtml(name)}
                    </h3>

                    <div class="product-brand">
                        ${escapeHtml(brand)}
                    </div>

                </div>

            </div>


            <div class="status ${statusClass}">

                <div class="status-icon"></div>

                <h4>
                    ${statusTitle}
                </h4>

                <p>
                    ${statusText}
                </p>

            </div>


            <div class="details">

                <div class="detail-title">
                    Ingredienti
                </div>

                <div class="ingredients">
                    ${escapeHtml(ingredients)}
                </div>

                <div class="ingredients"
                     style="margin-top:18px;font-size:13px">

                    Codice EAN: ${barcode}

                    <br>

                    Dati: Open Food Facts

                </div>


                ${
                    lactoseDetected || lactoseTextDetected
                    ?
                    `
                    <div class="alternatives">

                        <h3>
                            💡 Cerca un'alternativa
                        </h3>

                        <p>
                            Questo prodotto potrebbe contenere
                            lattosio o derivati del latte.
                            Prova a cercare prodotti con indicazioni
                            come "senza lattosio", "lactose free"
                            o alternative vegetali.
                        </p>

                        <div class="alt-list">

                            <div class="alt">
                                <strong>
                                    Versione senza lattosio
                                </strong>

                                <span>
                                    CONSIGLIATA
                                </span>
                            </div>

                            <div class="alt">
                                <strong>
                                    Versione vegetale
                                </strong>

                                <span>
                                    ALTERNATIVA
                                </span>
                            </div>

                        </div>

                    </div>
                    `
                    :
                    ""
                }

            </div>

        </article>
    `;
}


/* =========================
   SECURITY
========================= */

function escapeHtml(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
