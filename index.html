<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#F7F7F5">

<title>Lactobluster</title>

<script src="https://unpkg.com/html5-qrcode" defer></script>

<style>

:root{
    --bg:#F7F7F5;
    --card:#FFFFFF;
    --text:#111111;
    --muted:#777777;
    --line:#E9E9E6;

    --green:#19A463;
    --green-dark:#137B4A;
    --green-bg:#E9F7EF;

    --orange:#F39A24;
    --orange-dark:#A96200;
    --orange-bg:#FFF3DF;

    --red:#E94B4B;
    --red-dark:#B82E2E;
    --red-bg:#FCEAEA;

    --shadow:0 10px 35px rgba(0,0,0,.07);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;
}

.app{
    width:100%;
    max-width:520px;
    margin:auto;
    padding:
        max(24px, env(safe-area-inset-top))
        18px
        calc(50px + env(safe-area-inset-bottom));
}


/* =========================
   HEADER
========================= */

.header{
    text-align:center;
    padding:22px 0 28px;
}

.logo{
    margin:0;
    font-size:48px;
    line-height:.95;
    font-weight:900;
    letter-spacing:-3.5px;
}

.tagline{
    margin:12px 0 0;
    color:#777;
    font-size:17px;
    line-height:1.3;
}


/* =========================
   SCAN BUTTON
========================= */

.scan-button{
    width:100%;
    height:66px;

    border:0;
    border-radius:22px;

    background:#111;
    color:white;

    font-size:18px;
    font-weight:850;

    box-shadow:
        0 10px 25px rgba(0,0,0,.12);

    cursor:pointer;
}

.scan-button:active{
    transform:scale(.985);
}


/* =========================
   SCANNER
========================= */

#reader{
    display:none;
    margin-top:16px;

    overflow:hidden;

    border-radius:28px;

    background:#000;
}

#reader video{
    border-radius:28px;
}

.scanner-info{
    display:none;

    margin-top:10px;

    text-align:center;

    font-size:14px;
    color:#777;
}


/* =========================
   MESSAGE
========================= */

.message{
    min-height:20px;

    margin:12px 0;

    text-align:center;

    font-size:14px;
    color:#777;
}

.error{
    color:#D93636;
    font-weight:600;
}


/* =========================
   PRODUCT CARD
========================= */

.product-card{
    margin-top:18px;

    padding:18px;

    background:white;

    border-radius:30px;

    box-shadow:var(--shadow);
}


/* =========================
   PRODUCT TOP
========================= */

.product-top{
    display:flex;
    align-items:center;

    gap:16px;
}


/* IMAGE */

.product-image-wrap{
    width:112px;
    height:112px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    border-radius:22px;

    background:#F3F3F1;
}

.product-image{
    width:100%;
    height:100%;

    object-fit:contain;
}


/* PRODUCT NAME */

.product-info{
    min-width:0;
}

.product-brand{
    margin:0 0 5px;

    font-size:14px;
    color:#777;

    font-weight:500;
}

.product-name{
    margin:0;

    font-size:25px;
    line-height:1.08;

    letter-spacing:-.7px;

    font-weight:850;
}


/* =========================
   STATUS
========================= */

.status{
    margin-top:18px;

    padding:22px;

    border-radius:24px;
}

.status.green{
    background:var(--green-bg);
    color:var(--green-dark);
}

.status.orange{
    background:var(--orange-bg);
    color:var(--orange-dark);
}

.status.red{
    background:var(--red-bg);
    color:var(--red-dark);
}

.status-top{
    display:flex;
    align-items:center;
    gap:13px;
}

.status-icon{
    width:22px;
    height:22px;

    border-radius:50%;

    flex-shrink:0;
}

.green .status-icon{
    background:var(--green);
}

.orange .status-icon{
    background:var(--orange);
}

.red .status-icon{
    background:var(--red);
}

.status-title{
    margin:0;

    font-size:21px;
    line-height:1.05;

    font-weight:900;
}

.status-description{
    margin:13px 0 0;

    font-size:15px;
    line-height:1.45;
}


/* =========================
   ADVICE
========================= */

.advice{
    display:flex;
    align-items:flex-start;

    gap:12px;

    margin-top:15px;

    padding:16px;

    border-radius:20px;

    background:#F7F7F5;
}

.advice-icon{
    font-size:22px;
    line-height:1;
}

.advice-content{
    flex:1;
}

.advice-title{
    margin:0 0 4px;

    font-size:15px;
    font-weight:850;
}

.advice-text{
    margin:0;

    font-size:13px;
    line-height:1.45;

    color:#666;
}


/* =========================
   SECTION
========================= */

.section{
    margin-top:23px;
}

.section-title{
    margin:0 0 9px;

    font-size:19px;
    font-weight:850;
}

.ingredients{
    margin:0;

    font-size:15px;
    line-height:1.55;

    color:#333;
}


/* =========================
   ALTERNATIVES
========================= */

.alternatives-section{
    margin-top:25px;
}

.alternatives-heading{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;

    gap:10px;
}

.alternatives-title{
    margin:0;

    font-size:20px;
    font-weight:850;
}

.alternatives-subtitle{
    margin:4px 0 0;

    font-size:13px;
    color:#888;
}

.alternatives{
    display:flex;
    gap:12px;

    overflow-x:auto;

    padding:14px 1px 4px;

    scrollbar-width:none;
}

.alternatives::-webkit-scrollbar{
    display:none;
}

.alternative{
    width:160px;
    min-width:160px;

    padding:10px;

    background:#F7F7F5;

    border-radius:21px;
}

.alternative-image{
    width:100%;
    height:115px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:white;

    border-radius:16px;
}

.alternative-image img{
    width:100%;
    height:100%;

    object-fit:contain;
}

.alternative-name{
    margin-top:9px;

    font-size:13px;
    line-height:1.2;

    font-weight:800;
}

.alternative-brand{
    margin-top:4px;

    font-size:11px;

    color:#888;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.free-badge{
    display:inline-block;

    margin-top:8px;

    padding:5px 8px;

    border-radius:999px;

    background:var(--green-bg);

    color:var(--green-dark);

    font-size:10px;
    font-weight:850;
}


/* =========================
   EAN
========================= */

.ean{
    margin-top:22px;

    padding-top:16px;

    border-top:1px solid var(--line);

    text-align:center;

    color:#999;

    font-size:11px;
}


/* =========================
   MANUAL SEARCH
========================= */

.manual{
    margin-top:18px;

    padding:20px;

    background:white;

    border-radius:26px;

    box-shadow:0 7px 25px rgba(0,0,0,.04);
}

.manual-title{
    margin:0 0 12px;

    font-size:18px;
    font-weight:850;
}

.manual-input{
    width:100%;
    height:55px;

    padding:0 16px;

    border:1px solid #DDD;

    border-radius:17px;

    background:white;

    font-size:17px;

    outline:none;
}

.manual-input:focus{
    border-color:#999;
}

.manual-button{
    width:100%;
    height:55px;

    margin-top:10px;

    border:0;
    border-radius:17px;

    background:#111;
    color:white;

    font-size:16px;
    font-weight:850;
}


/* =========================
   DISCLAIMER
========================= */

.disclaimer{
    margin:18px 10px 0;

    text-align:center;

    color:#999;

    font-size:11px;
    line-height:1.45;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:380px){

    .logo{
        font-size:42px;
    }

    .product-image-wrap{
        width:94px;
        height:94px;
    }

    .product-name{
        font-size:22px;
    }

    .status-title{
        font-size:19px;
    }
}

</style>
</head>


<body>

<div class="app">


    <!-- HEADER -->

    <header class="header">

        <h1 class="logo">
            Lactobluster
        </h1>

        <p class="tagline">
            Scansiona. Controlla. Mangia tranquillo.
        </p>

    </header>


    <!-- SCAN -->

    <button
        id="scanButton"
        class="scan-button">

        📷 &nbsp; SCANSIONA PRODOTTO

    </button>


    <!-- CAMERA -->

    <div id="reader"></div>

    <div
        id="scannerInfo"
        class="scanner-info">

        Inquadra il codice a barre

    </div>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message">
    </div>


    <!-- RESULT -->

    <div id="result"></div>


    <!-- MANUAL -->

    <section class="manual">

        <h2 class="manual-title">
            Inserisci il codice a barre
        </h2>

        <input
            id="ean"
            class="manual-input"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="es. 8007290000477">

        <button
            id="searchButton"
            class="manual-button">

            CERCA PRODOTTO

        </button>

    </section>


    <p class="disclaimer">

        Dati forniti da Open Food Facts.<br>

        Per allergie e intolleranze verifica sempre
        anche l'etichetta originale del prodotto.

    </p>


</div>


<script>

let scanner = null;


/* ==========================================
   UTILITY
========================================== */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* ==========================================
   NORMALIZZA TESTO
========================================== */

function productText(product){

    return (

        (product.ingredients_text_it ||
         product.ingredients_text ||
         "") +

        " " +

        (product.allergens ||
         "") +

        " " +

        (product.labels ||
         "") +

        " " +

        (product.labels_tags || []).join(" ")

    ).toLowerCase();
}


/* ==========================================
   CLASSIFICAZIONE LATTOSIO
========================================== */

function classifyProduct(product){

    const ingredients = (

        product.ingredients_text_it ||
        product.ingredients_text ||
        ""

    ).toLowerCase();


    const labels = (

        product.labels ||
        ""

    ).toLowerCase();


    const text =
        ingredients +
        " " +
        labels +
        " " +
        (product.labels_tags || []).join(" ").toLowerCase();


    /*
       SENZA LATTOSIO
    */

    if(

        /senza\s+lattosio/.test(text) ||

        /lactose[\s-]*free/.test(text) ||

        /sin\s+lactosa/.test(text)

    ){

        return {

            type:"green",

            title:"SENZA LATTOSIO",

            description:
                "Il prodotto riporta una dichiarazione relativa all'assenza di lattosio.",

            adviceTitle:"Puoi tenerlo tra le opzioni",

            adviceText:
                "La confezione indica l'assenza di lattosio. Controlla comunque sempre l'etichetta aggiornata."

        };

    }


    /*
       LATTOSIO ESPLICITO
    */

    if(

        /\blattosio\b/.test(ingredients) ||

        /\blactose\b/.test(ingredients)

    ){

        return {

            type:"red",

            title:"LATTOSIO RILEVATO",

            description:
                "Il lattosio compare tra gli ingredienti disponibili nel database.",

            adviceTitle:"Cerca un'alternativa",

            adviceText:
                "Prova a cercare una versione senza lattosio dello stesso prodotto o della stessa categoria."

        };

    }


    /*
       LATTE / DERIVATI
    */

    if(

        /\blatte\b/.test(ingredients) ||
        /\bmilk\b/.test(ingredients) ||
        /\bsiero\b/.test(ingredients) ||
        /\bwhey\b/.test(ingredients) ||
        /\bcaseina\b/.test(ingredients) ||
        /\bcasein\b/.test(ingredients) ||
        /\bpanna\b/.test(ingredients) ||
        /\bburro\b/.test(ingredients) ||
        /\bcream\b/.test(ingredients)

    ){

        return {

            type:"orange",

            title:"DA VERIFICARE",

            description:
                "Sono presenti latte o derivati. Questo non permette di stabilire automaticamente la quantità di lattosio.",

            adviceTitle:"Controlla l'etichetta",

            adviceText:
                "Se devi evitare il lattosio, verifica la confezione e cerca eventualmente una variante senza lattosio."

        };

    }


    /*
       INGREDIENTI ASSENTI
    */

    if(!ingredients.trim()){

        return {

            type:"orange",

            title:"DATI INSUFFICIENTI",

            description:
                "Il database non contiene abbastanza informazioni sugli ingredienti.",

            adviceTitle:"Meglio controllare",

            adviceText:
                "Non basarti solo sul risultato dell'app: verifica direttamente l'etichetta."

        };

    }


    /*
       NESSUN RIFERIMENTO
    */

    return {

        type:"green",

        title:"LATTOSIO NON RILEVATO",

        description:
            "Negli ingredienti disponibili non sono stati trovati riferimenti al lattosio o a derivati del latte.",

        adviceTitle:"Nessun riferimento trovato",

        adviceText:
            "Il risultato riguarda i dati presenti nel database e non sostituisce la verifica dell'etichetta."

    };

}


/* ==========================================
   TROVA ALTERNATIVE
========================================== */

async function findAlternatives(product){

    const categories =
        product.categories_tags || [];


    if(!categories.length)
        return [];


    /*
       Prendiamo le categorie più specifiche
       e proviamo fino a 2 ricerche.
    */

    const candidates =
        categories
            .slice()
            .reverse()
            .filter(x => x && x !== "en:foods")
            .slice(0,2);


    for(const category of candidates){

        try{

            const categoryClean =
                category.replace(/^([a-z]{2}:)/i,"");


            const params =
                new URLSearchParams({

                    categories_tags_en:
                        categoryClean,

                    page_size:"50",

                    fields:
                        "code,product_name,product_name_it,brands,image_front_small_url,image_front_thumb_url,ingredients_text_it,ingredients_text,labels,labels_tags"

                });


            const response =
                await fetch(

                    "https://world.openfoodfacts.org/api/v2/search?" +
                    params.toString()

                );


            if(!response.ok)
                continue;


            const data =
                await response.json();


            const products =
                data.products || [];


            const alternatives =
                products

                    .filter(item =>
                        item.code &&
                        item.code !== product.code
                    )

                    .filter(item => {

                        const text =
                            productText(item);

                        return (

                            /senza\s+lattosio/.test(text) ||

                            /lactose[\s-]*free/.test(text)

                        );

                    })

                    .slice(0,6);


            if(alternatives.length)
                return alternatives;

        }
        catch(error){

            // Continua con la categoria successiva

        }

    }


    return [];

}


/* ==========================================
   RENDER ALTERNATIVE
========================================== */

function renderAlternatives(products){

    if(!products.length)
        return "";


    return `

        <section class="alternatives-section">

            <div class="alternatives-heading">

                <div>

                    <h3 class="alternatives-title">
                        Alternative
                    </h3>

                    <p class="alternatives-subtitle">
                        Prodotti della stessa categoria senza lattosio
                    </p>

                </div>

            </div>


            <div class="alternatives">

                ${products.map(product => {

                    const image =
                        product.image_front_small_url ||
                        product.image_front_thumb_url ||
                        "";


                    const name =
                        product.product_name_it ||
                        product.product_name ||
                        "Prodotto";


                    const brand =
                        product.brands ||
                        "";


                    return `

                        <article class="alternative">


                            <div class="alternative-image">

                                ${
                                    image

                                    ?

                                    `<img
                                        src="${escapeHTML(image)}"
                                        alt="${escapeHTML(name)}"
                                        loading="lazy"
                                    >`

                                    :

                                    `<span
                                        style="
                                            font-size:38px;
                                        "
                                    >
                                        📦
                                    </span>`
                                }

                            </div>


                            <div class="alternative-name">

                                ${escapeHTML(name)}

                            </div>


                            ${
                                brand

                                ?

                                `<div class="alternative-brand">
                                    ${escapeHTML(brand)}
                                </div>`

                                :

                                ""
                            }


                            <span class="free-badge">

                                ✓ SENZA LATTOSIO

                            </span>


                        </article>

                    `;

                }).join("")}

            </div>

        </section>

    `;

}


/* ==========================================
   RICERCA PRODOTTO
========================================== */

async function searchProduct(code){

    code =
        String(code || "")
            .replace(/\D/g,"");


    if(!code){

        document.getElementById("message").innerHTML =

            `<div class="error">
                Inserisci un codice a barre valido.
             </div>`;

        return;

    }


    document.getElementById("message").innerHTML =
        "🔎 Cerco il prodotto…";


    document.getElementById("result").innerHTML =
        "";


    try{

        const response =
            await fetch(

                "https://world.openfoodfacts.org/api/v2/product/" +
                encodeURIComponent(code) +
                ".json"

            );


        const data =
            await response.json();


        if(data.status !== 1)
            throw new Error("not-found");


        const product =
            data.product || {};


        const classification =
            classifyProduct(product);


        const image =

            product.image_front_small_url ||

            product.image_front_thumb_url ||

            product.image_url ||

            "";


        const name =

            product.product_name_it ||

            product.product_name ||

            "Prodotto";


        const brand =
            product.brands ||
            "";


        const ingredients =

            product.ingredients_text_it ||

            product.ingredients_text ||

            "Ingredienti non disponibili.";


        let alternatives = [];


        if(

            classification.type === "red" ||

            classification.type === "orange"

        ){

            alternatives =
                await findAlternatives(product);

        }


        document.getElementById("result").innerHTML = `

            <section class="product-card">


                <!-- PRODOTTO -->

                <div class="product-top">


                    <div class="product-image-wrap">

                        ${
                            image

                            ?

                            `<img
                                class="product-image"
                                src="${escapeHTML(image)}"
                                alt="${escapeHTML(name)}"
                            >`

                            :

                            `<span
                                style="
                                    font-size:42px;
                                "
                            >
                                📦
                            </span>`
                        }

                    </div>


                    <div class="product-info">


                        ${
                            brand

                            ?

                            `<p class="product-brand">
                                ${escapeHTML(brand)}
                             </p>`

                            :

                            ""
                        }


                        <h2 class="product-name">

                            ${escapeHTML(name)}

                        </h2>


                    </div>

                </div>


                <!-- STATO -->

                <div
                    class="status ${classification.type}">

                    <div class="status-top">

                        <span class="status-icon"></span>

                        <h3 class="status-title">

                            ${escapeHTML(
                                classification.title
                            )}

                        </h3>

                    </div>


                    <p class="status-description">

                        ${escapeHTML(
                            classification.description
                        )}

                    </p>

                </div>


                <!-- CONSIGLIO -->

                <div class="advice">

                    <div class="advice-icon">

                        💡

                    </div>


                    <div class="advice-content">

                        <p class="advice-title">

                            ${escapeHTML(
                                classification.adviceTitle
                            )}

                        </p>


                        <p class="advice-text">

                            ${escapeHTML(
                                classification.adviceText
                            )}

                        </p>

                    </div>

                </div>


                <!-- INGREDIENTI -->

                <section class="section">

                    <h3 class="section-title">

                        Ingredienti

                    </h3>


                    <p class="ingredients">

                        ${escapeHTML(
                            ingredients
                        )}

                    </p>

                </section>


                <!-- ALTERNATIVE -->

                ${renderAlternatives(alternatives)}


                <!-- EAN -->

                <div class="ean">

                    EAN ${escapeHTML(code)}
                    ·
                    Dati Open Food Facts

                </div>


            </section>

        `;


        document.getElementById("message").innerHTML =
            "";


        document
            .querySelector(".product-card")
            ?.scrollIntoView({

                behavior:"smooth",

                block:"start"

            });

    }


    catch(error){

        document.getElementById("message").innerHTML = `

            <div class="error">

                ❌ Prodotto non trovato.
                Prova a controllare il codice a barre.

            </div>

        `;

    }

}


/* ==========================================
   SCANNER
========================================== */

function startScanner(){

    const reader =
        document.getElementById("reader");


    const button =
        document.getElementById("scanButton");


    const info =
        document.getElementById("scannerInfo");


    reader.style.display =
        "block";


    info.style.display =
        "block";


    button.style.display =
        "none";


    document.getElementById("message").innerText =
        "Avvio fotocamera…";


    scanner =
        new Html5Qrcode("reader");


    scanner.start(

        {
            facingMode:"environment"
        },

        {

            fps:10,

            qrbox:{
                width:290,
                height:120
            },

            aspectRatio:1.777

        },


        decodedText => {

            stopScanner();

            searchProduct(decodedText);

        },


        () => {}

    )

    .then(() => {

        document.getElementById("message").innerText =
            "";

    })


    .catch(() => {

        stopScanner();


        document.getElementById("message").innerHTML = `

            <div class="error">

                Non riesco ad accedere alla fotocamera.
                Controlla i permessi di Safari.

            </div>

        `;

    });

}


/* ==========================================
   STOP SCANNER
========================================== */

function stopScanner(){

    if(scanner){

        try{

            scanner.stop()
                .catch(() => {});

        }
        catch(error){}

        scanner = null;

    }


    document.getElementById("reader").style.display =
        "none";


    document.getElementById("scannerInfo").style.display =
        "none";


    document.getElementById("scanButton").style.display =
        "block";

}


/* ==========================================
   EVENTI
========================================== */

document
    .getElementById("scanButton")
    .addEventListener(
        "click",
        startScanner
    );


document
    .getElementById("searchButton")
    .addEventListener(

        "click",

        () => {

            searchProduct(
                document.getElementById("ean").value
            );

        }

    );


document
    .getElementById("ean")
    .addEventListener(

        "keydown",

        event => {

            if(event.key === "Enter"){

                searchProduct(
                    event.target.value
                );

            }

        }

    );

</script>

</body>
</html>
