<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F6F5F1">

<title>Lactobluster</title>

<script src="https://unpkg.com/html5-qrcode" defer></script>

<style>
:root {
    --bg: #f6f5f1;
    --white: #ffffff;
    --black: #111111;
    --gray: #777;
    --light-gray: #e9e7e2;

    --green: #16a05d;
    --green-bg: #e7f7ed;

    --orange: #ed941b;
    --orange-bg: #fff2dc;

    --red: #e54848;
    --red-bg: #fde9e9;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--black);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;
}

.app {
    width: 100%;
    max-width: 520px;
    margin: auto;
    padding: 28px 18px 45px;
}

/* HEADER */

header {
    text-align: center;
    padding: 8px 0 26px;
}

.logo {
    margin: 0;
    font-size: 46px;
    line-height: .95;
    font-weight: 900;
    letter-spacing: -3px;
}

.tagline {
    margin: 12px 0 0;
    font-size: 17px;
    color: #777;
}

/* SCAN BUTTON */

.scan-button {
    width: 100%;
    height: 64px;
    border: 0;
    border-radius: 22px;
    background: #111;
    color: white;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: .2px;
    box-shadow: 0 10px 25px rgba(0,0,0,.10);
}

.scan-button:active {
    transform: scale(.98);
}

/* CAMERA */

#reader {
    display: none;
    margin-top: 16px;
    border-radius: 24px;
    overflow: hidden;
    background: #000;
}

/* RESULT */

.product-card {
    margin-top: 20px;
    background: white;
    border-radius: 30px;
    padding: 20px;
    box-shadow: 0 12px 35px rgba(0,0,0,.07);
}

/* PRODUCT HEADER */

.product-header {
    display: flex;
    align-items: center;
    gap: 16px;
}

.product-image {
    width: 100px;
    height: 100px;
    flex-shrink: 0;
    object-fit: contain;
    border-radius: 20px;
    background: #f3f2ee;
    padding: 8px;
}

.product-info {
    min-width: 0;
}

.brand {
    margin: 0 0 6px;
    font-size: 14px;
    color: #777;
}

.product-name {
    margin: 0;
    font-size: 25px;
    line-height: 1.08;
    font-weight: 850;
    letter-spacing: -.7px;
}

/* STATUS */

.status {
    margin-top: 20px;
    border-radius: 24px;
    padding: 21px;
}

.status.green {
    background: var(--green-bg);
    color: #147b46;
}

.status.orange {
    background: var(--orange-bg);
    color: #ad6700;
}

.status.red {
    background: var(--red-bg);
    color: #bd2929;
}

.status-title {
    display: flex;
    align-items: center;
    gap: 12px;
}

.status-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    flex-shrink: 0;
}

.green .status-dot {
    background: var(--green);
}

.orange .status-dot {
    background: var(--orange);
}

.red .status-dot {
    background: var(--red);
}

.status h2 {
    margin: 0;
    font-size: 21px;
    line-height: 1.05;
    font-weight: 900;
}

.status p {
    margin: 11px 0 0;
    font-size: 15px;
    line-height: 1.45;
}

/* INGREDIENTS */

.section-title {
    margin: 24px 0 9px;
    font-size: 19px;
    font-weight: 850;
}

.ingredients {
    margin: 0;
    font-size: 16px;
    line-height: 1.5;
}

/* ALTERNATIVES */

.alternative-header {
    margin-top: 27px;
}

.alternative-header h3 {
    margin: 0;
    font-size: 20px;
    font-weight: 850;
}

.alternative-header p {
    margin: 4px 0 0;
    font-size: 13px;
    color: #888;
}

.alternatives {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding: 13px 1px 5px;
    scrollbar-width: none;
}

.alternatives::-webkit-scrollbar {
    display: none;
}

.alternative {
    min-width: 155px;
    max-width: 155px;
    padding: 10px;
    border-radius: 20px;
    background: #f6f5f1;
}

.alternative img {
    width: 100%;
    height: 105px;
    object-fit: contain;
    background: white;
    border-radius: 14px;
}

.alternative-name {
    margin-top: 9px;
    font-size: 13px;
    line-height: 1.2;
    font-weight: 800;
}

.alternative-brand {
    margin-top: 4px;
    color: #888;
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.lactose-free {
    display: inline-block;
    margin-top: 8px;
    padding: 5px 8px;
    border-radius: 999px;
    background: var(--green-bg);
    color: #147b46;
    font-size: 10px;
    font-weight: 850;
}

/* EAN */

.ean {
    margin-top: 22px;
    text-align: center;
    color: #999;
    font-size: 12px;
}

/* MANUAL SEARCH */

.manual {
    margin-top: 20px;
    padding: 20px;
    background: white;
    border-radius: 26px;
}

.manual h3 {
    margin: 0 0 12px;
    font-size: 19px;
}

.manual input {
    width: 100%;
    height: 54px;
    border: 1px solid #ddd;
    border-radius: 16px;
    padding: 0 16px;
    font-size: 17px;
    outline: none;
}

.manual input:focus {
    border-color: #888;
}

.manual button {
    width: 100%;
    height: 54px;
    margin-top: 10px;
    border: 0;
    border-radius: 16px;
    background: #111;
    color: white;
    font-size: 16px;
    font-weight: 800;
}

/* MESSAGES */

.message {
    text-align: center;
    margin: 14px 0;
    color: #777;
    font-size: 14px;
}

.error {
    color: #d63333;
}

.disclaimer {
    margin: 18px 8px 0;
    text-align: center;
    color: #888;
    font-size: 11px;
    line-height: 1.45;
}

/* MOBILE */

@media(max-width:380px) {

    .logo {
        font-size: 40px;
    }

    .product-name {
        font-size: 22px;
    }

    .product-image {
        width: 85px;
        height: 85px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <h1 class="logo">Lactobluster</h1>
    <p class="tagline">
        Scansiona. Controlla. Mangia tranquillo.
    </p>
</header>

<button class="scan-button" id="scanButton">
    📷 &nbsp; SCANSIONA PRODOTTO
</button>

<div id="reader"></div>

<div id="message" class="message"></div>

<div id="result"></div>

<section class="manual">

    <h3>Inserisci il codice a barre</h3>

    <input
        id="ean"
        type="text"
        inputmode="numeric"
        placeholder="es. 8007290000477"
    >

    <button id="searchButton">
        CERCA PRODOTTO
    </button>

</section>

<p class="disclaimer">
    Dati forniti da Open Food Facts.
    Per allergie e intolleranze verifica sempre anche l'etichetta originale.
</p>

</div>


<script>

let scanner = null;


/* -----------------------------
   UTILITY
----------------------------- */

function escapeHTML(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* -----------------------------
   CLASSIFICAZIONE LATTOSIO
----------------------------- */

function classifyProduct(product) {

    const ingredients =
        (
            product.ingredients_text_it ||
            product.ingredients_text ||
            ""
        ).toLowerCase();

    const labels =
        (
            product.labels_it ||
            product.labels ||
            ""
        ).toLowerCase();

    const tags =
        (
            product.labels_tags || []
        ).join(" ").toLowerCase();

    const allergens =
        (
            product.allergens ||
            ""
        ).toLowerCase();


    const allText =
        ingredients +
        " " +
        labels +
        " " +
        tags +
        " " +
        allergens;


    /* SENZA LATTOSIO */

    if (
        /senza\s+lattosio/.test(allText) ||
        /lactose[-\s]+free/.test(allText)
    ) {

        return {

            type: "green",

            title: "SENZA LATTOSIO",

            description:
                "Il prodotto riporta una dichiarazione relativa all'assenza di lattosio."

        };

    }


    /* LATTOSIO ESPLICITO */

    if (
        /lattosio/.test(ingredients) ||
        /lactose/.test(ingredients)
    ) {

        return {

            type: "red",

            title: "LATTOSIO RILEVATO",

            description:
                "Il lattosio è indicato tra gli ingredienti disponibili nel database."

        };

    }


    /* DERIVATI DEL LATTE */

    if (
        /\blatte\b/.test(ingredients) ||
        /\bmilk\b/.test(ingredients) ||
        /siero/.test(ingredients) ||
        /whey/.test(ingredients) ||
        /caseina/.test(ingredients) ||
        /casein/.test(ingredients) ||
        /panna/.test(ingredients) ||
        /burro/.test(ingredients)
    ) {

        return {

            type: "orange",

            title: "DA VERIFICARE",

            description:
                "Sono presenti latte o derivati. Controlla la confezione per verificare la presenza di lattosio."

        };

    }


    /* DATI ASSENTI */

    if (!ingredients.trim()) {

        return {

            type: "orange",

            title: "DATI INSUFFICIENTI",

            description:
                "Non sono disponibili abbastanza informazioni per una valutazione affidabile."

        };

    }


    /* NESSUN RIFERIMENTO */

    return {

        type: "green",

        title: "LATTOSIO NON RILEVATO",

        description:
            "Non è stato trovato un riferimento al lattosio negli ingredienti disponibili."

    };
}


/* -----------------------------
   ALTERNATIVE
----------------------------- */

async function findAlternatives(product) {

    const categories =
        product.categories_tags || [];

    if (!categories.length)
        return [];


    const category =
        categories[categories.length - 1];


    try {

        const params = new URLSearchParams({

            categories_tags: category,

            page_size: "40",

            fields:
                "code,product_name,product_name_it,brands,image_front_small_url,image_front_thumb_url,ingredients_text_it,ingredients_text,labels,labels_tags"

        });


        const response =
            await fetch(
                "https://world.openfoodfacts.org/api/v2/search?" +
                params.toString()
            );


        const data =
            await response.json();


        return (data.products || [])

            .filter(item =>
                item.code &&
                item.code !== product.code
            )

            .filter(item => {

                const text = (

                    (item.ingredients_text_it ||
                     item.ingredients_text ||
                     "") +

                    " " +

                    (item.labels || "") +

                    " " +

                    (item.labels_tags || []).join(" ")

                ).toLowerCase();


                return (
                    /senza\s+lattosio/.test(text) ||
                    /lactose[-\s]+free/.test(text)
                );

            })

            .slice(0, 6);

    }

    catch (error) {

        return [];

    }
}


/* -----------------------------
   HTML ALTERNATIVE
----------------------------- */

function renderAlternatives(products) {

    if (!products.length)
        return "";


    return `

        <div class="alternative-header">

            <h3>Alternative senza lattosio</h3>

            <p>
                Potrebbero essere adatte come alternativa
            </p>

        </div>

        <div class="alternatives">

            ${products.map(product => {

                const image =
                    product.image_front_small_url ||
                    product.image_front_thumb_url ||
                    "";


                const name =
                    product.product_name_it ||
                    product.product_name ||
                    "Prodotto";


                const brand =
                    product.brands ||
                    "";


                return `

                    <article class="alternative">

                        ${
                            image

                            ?

                            `<img
                                src="${escapeHTML(image)}"
                                alt=""
                            >`

                            :

                            `<div
                                style="
                                    height:105px;
                                    border-radius:14px;
                                    background:#eee;
                                "
                            ></div>`
                        }


                        <div class="alternative-name">

                            ${escapeHTML(name)}

                        </div>


                        <div class="alternative-brand">

                            ${escapeHTML(brand)}

                        </div>


                        <span class="lactose-free">

                            ✓ SENZA LATTOSIO

                        </span>

                    </article>

                `;

            }).join("")}

        </div>
    `;
}


/* -----------------------------
   RICERCA PRODOTTO
----------------------------- */

async function searchProduct(code) {

    code =
        String(code || "")
        .replace(/\D/g, "");


    if (!code) {

        document.getElementById("message").innerHTML =
            '<div class="error">Inserisci un codice a barre valido.</div>';

        return;
    }


    document.getElementById("message").innerHTML =
        "🔎 Cerco il prodotto…";


    document.getElementById("result").innerHTML =
        "";


    try {

        const response =
            await fetch(
                "https://world.openfoodfacts.org/api/v2/product/" +
                encodeURIComponent(code) +
                ".json"
            );


        const data =
            await response.json();


        if (data.status !== 1)
            throw new Error("not-found");


        const product =
            data.product || {};


        const classification =
            classifyProduct(product);


        const image =
            product.image_front_small_url ||
            product.image_front_thumb_url ||
            product.image_url ||
            "";


        const name =
            product.product_name_it ||
            product.product_name ||
            "Prodotto senza nome";


        const brand =
            product.brands ||
            "";


        const ingredients =
            product.ingredients_text_it ||
            product.ingredients_text ||
            "Ingredienti non disponibili.";


        let alternatives = [];


        if (
            classification.type === "red" ||
            classification.type === "orange"
        ) {

            alternatives =
                await findAlternatives(product);

        }


        document.getElementById("result").innerHTML = `

            <section class="product-card">


                <!-- PRODOTTO -->

                <div class="product-header">

                    ${
                        image

                        ?

                        `<img
                            class="product-image"
                            src="${escapeHTML(image)}"
                            alt=""
                        >`

                        :

                        `<div
                            class="product-image"
                            style="
                                display:flex;
                                align-items:center;
                                justify-content:center;
                                font-size:38px;
                            "
                        >
                            📦
                        </div>`
                    }


                    <div class="product-info">

                        <p class="brand">

                            ${escapeHTML(brand)}

                        </p>


                        <h2 class="product-name">

                            ${escapeHTML(name)}

                        </h2>

                    </div>

                </div>


                <!-- STATO -->

                <div class="status ${classification.type}">

                    <div class="status-title">

                        <span class="status-dot"></span>

                        <h2>

                            ${escapeHTML(
                                classification.title
                            )}

                        </h2>

                    </div>


                    <p>

                        ${escapeHTML(
                            classification.description
                        )}

                    </p>

                </div>


                <!-- INGREDIENTI -->

                <div class="section-title">

                    Ingredienti

                </div>


                <p class="ingredients">

                    ${escapeHTML(ingredients)}

                </p>


                <!-- ALTERNATIVE -->

                ${renderAlternatives(alternatives)}


                <!-- EAN -->

                <div class="ean">

                    EAN ${escapeHTML(code)}
                    ·
                    Open Food Facts

                </div>

            </section>

        `;


        document.getElementById("message").innerHTML =
            "";


        document
            .querySelector(".product-card")
            ?.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

    }

    catch (error) {

        document.getElementById("message").innerHTML = `

            <div class="error">

                ❌ Prodotto non trovato in Open Food Facts.

            </div>

        `;

    }

}


/* -----------------------------
   SCANNER
----------------------------- */

function startScanner() {

    const reader =
        document.getElementById("reader");

    const button =
        document.getElementById("scanButton");


    reader.style.display =
        "block";


    button.style.display =
        "none";


    document.getElementById("message").innerText =
        "Avvio fotocamera…";


    scanner =
        new Html5Qrcode("reader");


    scanner.start(

        {
            facingMode: "environment"
        },

        {
            fps: 10,

            qrbox: {
                width: 290,
                height: 130
            }
        },

        decodedText => {

            stopScanner();

            searchProduct(decodedText);

        },

        () => {}

    )

    .then(() => {

        document.getElementById("message").innerText =
            "Inquadra il codice a barre";

    })

    .catch(() => {

        stopScanner();


        document.getElementById("message").innerHTML = `

            <div class="error">

                Non riesco ad accedere alla fotocamera.
                Controlla i permessi di Safari.

            </div>

        `;

    });

}


/* -----------------------------
   STOP SCANNER
----------------------------- */

function stopScanner() {

    if (scanner) {

        try {

            scanner
                .stop()
                .catch(() => {});

        }

        catch (error) {}

        scanner = null;

    }


    document.getElementById("reader").style.display =
        "none";


    document.getElementById("scanButton").style.display =
        "block";

}


/* -----------------------------
   EVENTI
----------------------------- */

document
    .getElementById("scanButton")
    .addEventListener(
        "click",
        startScanner
    );


document
    .getElementById("searchButton")
    .addEventListener(
        "click",
        () => {

            searchProduct(
                document.getElementById("ean").value
            );

        }
    );


document
    .getElementById("ean")
    .addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {

                searchProduct(
                    event.target.value
                );

            }

        }
    );

</script>

</body>
</html>
