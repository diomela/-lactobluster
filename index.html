<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Lactobluster</title>

<meta name="theme-color" content="#09090B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lactobluster">

<!-- ICONA APP -->
<link
  rel="icon"
  type="image/png"
  href="https://raw.githubusercontent.com/diomela/-lactobluster/main/7B254A2F-7F3E-4478-B693-CF04829425F8.png">

<link
  rel="apple-touch-icon"
  href="https://raw.githubusercontent.com/diomela/-lactobluster/main/7B254A2F-7F3E-4478-B693-CF04829425F8.png">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

:root{
    --bg:#09090b;
    --surface:#111113;
    --surface2:#18181b;
    --surface3:#202024;

    --white:#f7f7f8;
    --muted:#96969f;
    --line:#29292e;

    --green:#42e879;
    --green-bg:rgba(66,232,121,.10);

    --red:#ff5d68;
    --red-bg:rgba(255,93,104,.10);

    --yellow:#ffc857;
    --yellow-bg:rgba(255,200,87,.10);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    background:var(--bg);
}

body{
    margin:0;
    background:
        radial-gradient(
            circle at 50% -20%,
            #202027 0%,
            #101014 30%,
            var(--bg) 62%
        );
    color:var(--white);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Helvetica,
        Arial,
        sans-serif;

    min-height:100vh;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    max-width:720px;
    margin:auto;

    padding:
        calc(env(safe-area-inset-top) + 22px)
        18px
        calc(env(safe-area-inset-bottom) + 40px);
}

/* =========================
   HEADER
========================= */

.header{
    display:flex;
    align-items:center;
    gap:13px;
    margin-bottom:54px;
}

.app-icon{
    width:52px;
    height:52px;

    border-radius:15px;

    object-fit:cover;

    background:#1c1c20;

    border:1px solid #303037;

    flex:none;
}

.brand{
    min-width:0;
}

.brand-name{
    font-size:27px;
    line-height:1;
    font-weight:750;
    letter-spacing:-1.1px;
}

.brand-sub{
    margin-top:6px;

    color:var(--muted);

    font-size:14px;
    letter-spacing:-.1px;
}

/* =========================
   HERO
========================= */

.hero{
    margin-bottom:29px;
}

.hero h1{
    margin:0;

    font-size:
        clamp(54px,15vw,86px);

    line-height:.87;

    letter-spacing:-5px;

    font-weight:800;
}

.hero h1 span{
    display:block;
}

.hero-description{
    margin:27px 0 0;

    max-width:590px;

    color:#a1a1aa;

    font-size:18px;
    line-height:1.45;

    letter-spacing:-.25px;
}

/* =========================
   MAIN SCAN BUTTON
========================= */

.scan-button{
    width:100%;

    border:0;

    border-radius:21px;

    padding:21px 20px;

    background:var(--white);
    color:#09090b;

    font-size:18px;
    font-weight:750;

    letter-spacing:-.35px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    transition:
        transform .15s ease,
        opacity .15s ease;
}

.scan-button:active{
    transform:scale(.98);
    opacity:.88;
}

.scan-icon{
    width:19px;
    height:19px;

    border:2px solid currentColor;

    border-radius:5px;

    position:relative;
}

.scan-icon:before,
.scan-icon:after{
    content:"";

    position:absolute;

    width:5px;
    height:5px;

    border:2px solid currentColor;
}

.scan-icon:before{
    left:-4px;
    top:-4px;
    border-right:0;
    border-bottom:0;
}

.scan-icon:after{
    right:-4px;
    bottom:-4px;
    border-left:0;
    border-top:0;
}

/* =========================
   SCANNER
========================= */

.scanner{
    display:none;

    margin-top:18px;

    background:#101012;

    border:1px solid var(--line);

    border-radius:25px;

    overflow:hidden;
}

.scanner-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:17px 18px;
}

.scanner-title{
    font-size:16px;
    font-weight:700;
}

.close-button{
    width:38px;
    height:38px;

    border:0;
    border-radius:50%;

    background:#252529;
    color:white;

    font-size:25px;

    display:flex;
    align-items:center;
    justify-content:center;
}

#reader{
    width:100%;
    min-height:260px;
    background:#000;
}

#reader video{
    width:100%!important;
    height:auto!important;
    object-fit:cover!important;
}

#reader__dashboard{
    display:none!important;
}

/* =========================
   LOADING
========================= */

.loading{
    display:none;

    padding:35px 10px;

    text-align:center;

    color:var(--muted);
}

.loader{
    width:28px;
    height:28px;

    margin:0 auto 14px;

    border-radius:50%;

    border:3px solid #303035;
    border-top-color:var(--green);

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   PRODUCT
========================= */

.result{
    margin-top:18px;
}

.product-card{
    background:var(--surface);

    border:1px solid var(--line);

    border-radius:28px;

    overflow:hidden;
}

.product-header{
    display:flex;

    gap:16px;

    padding:20px;

    align-items:center;
}

.product-photo-wrap{
    width:88px;
    height:88px;

    border-radius:19px;

    overflow:hidden;

    background:#202023;

    flex:none;

    display:flex;
    align-items:center;
    justify-content:center;
}

.product-photo{
    width:100%;
    height:100%;

    object-fit:contain;
}

.product-photo.placeholder{
    opacity:.3;
}

.product-info{
    min-width:0;
}

.product-name{
    margin:0;

    font-size:23px;
    line-height:1.04;

    letter-spacing:-.8px;

    font-weight:750;
}

.product-brand{
    margin-top:7px;

    color:var(--muted);

    font-size:15px;
}

/* =========================
   STATUS
========================= */

.status{
    margin:0 18px 18px;

    border-radius:23px;

    padding:28px 18px;

    text-align:center;
}

.status-dot{
    width:13px;
    height:13px;

    border-radius:50%;

    margin:0 auto 15px;
}

.status-title{
    margin:0;

    font-size:25px;
    line-height:1.05;

    letter-spacing:-.7px;

    font-weight:800;
}

.status-text{
    margin:12px auto 0;

    max-width:510px;

    font-size:15px;
    line-height:1.48;

    opacity:.72;
}

.status.safe{
    background:var(--green-bg);
    color:var(--green);
}

.status.safe .status-dot{
    background:var(--green);
    box-shadow:0 0 22px rgba(66,232,121,.5);
}

.status.danger{
    background:var(--red-bg);
    color:var(--red);
}

.status.danger .status-dot{
    background:var(--red);
    box-shadow:0 0 22px rgba(255,93,104,.45);
}

.status.warning{
    background:var(--yellow-bg);
    color:var(--yellow);
}

.status.warning .status-dot{
    background:var(--yellow);
}

/* =========================
   DETAILS
========================= */

.details{
    padding:2px 20px 22px;
}

.detail-label{
    margin:0 0 7px;

    font-size:17px;
    font-weight:750;
}

.ingredients{
    color:#a2a2aa;

    font-size:15px;
    line-height:1.5;
}

.meta{
    margin-top:19px;

    padding-top:17px;

    border-top:1px solid var(--line);

    display:flex;
    justify-content:space-between;

    color:#73737c;

    font-size:12px;
}

/* =========================
   ALTERNATIVE
========================= */

.alternative{
    margin-top:18px;

    padding:20px;

    background:var(--surface);

    border:1px solid var(--line);

    border-radius:24px;
}

.alternative-head{
    display:flex;
    align-items:center;
    gap:10px;
}

.alternative-badge{
    width:30px;
    height:30px;

    border-radius:10px;

    background:var(--green-bg);

    color:var(--green);

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:800;
}

.alternative-title{
    margin:0;

    font-size:18px;
    font-weight:750;
}

.alternative-description{
    margin:11px 0 16px;

    color:var(--muted);

    font-size:14px;
    line-height:1.45;
}

.alt-item{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    padding:13px 14px;

    margin-top:9px;

    border-radius:15px;

    background:var(--surface2);
}

.alt-item-name{
    font-size:14px;
    font-weight:650;
}

.alt-item-status{
    color:var(--green);

    font-size:12px;

    font-weight:750;

    white-space:nowrap;
}

/* =========================
   MANUAL SEARCH
========================= */

.manual{
    margin-top:18px;

    padding:20px;

    background:var(--surface);

    border:1px solid var(--line);

    border-radius:24px;
}

.manual-title{
    margin:0 0 13px;

    font-size:17px;
    font-weight:750;
}

.manual-row{
    display:flex;
    gap:9px;
}

.manual input{
    flex:1;

    min-width:0;

    background:var(--surface2);

    border:1px solid #34343a;

    color:white;

    border-radius:15px;

    padding:15px;

    font-size:16px;

    outline:none;
}

.manual input:focus{
    border-color:#55555d;
}

.manual button{
    border:0;

    border-radius:15px;

    padding:0 17px;

    background:#252529;

    color:white;

    font-weight:700;

    font-size:14px;
}

/* =========================
   ERROR
========================= */

.error{
    margin-top:18px;

    padding:17px;

    border-radius:18px;

    background:var(--red-bg);

    color:var(--red);

    font-size:14px;

    line-height:1.45;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:480px){

    .app{
        padding-left:15px;
        padding-right:15px;
    }

    .header{
        margin-bottom:46px;
    }

    .hero h1{
        letter-spacing:-4px;
    }

    .hero-description{
        font-size:17px;
    }

    .product-header{
        align-items:flex-start;
    }

    .product-photo-wrap{
        width:82px;
        height:82px;
    }

    .product-name{
        font-size:21px;
    }

}

</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <img
            class="app-icon"
            src="https://raw.githubusercontent.com/diomela/-lactobluster/main/7B254A2F-7F3E-4478-B693-CF04829425F8.png"
            alt="Lactobluster">

        <div class="brand">

            <div class="brand-name">
                Lactobluster
            </div>

            <div class="brand-sub">
                Controllo intelligente del lattosio
            </div>

        </div>

    </header>


    <!-- HERO -->

    <section class="hero">

        <h1>
            <span>Scansiona.</span>
            <span>Controlla.</span>
        </h1>

        <p class="hero-description">
            Scopri in pochi secondi se un prodotto
            contiene lattosio o derivati del latte.
        </p>

    </section>


    <!-- SCAN -->

    <button
        class="scan-button"
        onclick="openScanner()">

        <span class="scan-icon"></span>

        SCANSIONA PRODOTTO

    </button>


    <!-- SCANNER -->

    <section
        class="scanner"
        id="scanner">

        <div class="scanner-header">

            <div class="scanner-title">
                Inquadra il codice a barre
            </div>

            <button
                class="close-button"
                onclick="closeScanner()">

                ×

            </button>

        </div>

        <div id="reader"></div>

    </section>


    <!-- LOADING -->

    <div
        class="loading"
        id="loading">

        <div class="loader"></div>

        Controllo prodotto…

    </div>


    <!-- RESULT -->

    <div
        class="result"
        id="result">
    </div>


    <!-- MANUAL -->

    <section class="manual">

        <h3 class="manual-title">
            Inserisci un codice a barre
        </h3>

        <div class="manual-row">

            <input
                id="barcode"
                type="tel"
                inputmode="numeric"
                placeholder="Es. 8007290000477">

            <button onclick="manualSearch()">
                Cerca
            </button>

        </div>

    </section>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const IMAGE_BASE =
"https://raw.githubusercontent.com/diomela/-lactobluster/main/";

/* =====================================================
   SCANNER
===================================================== */

let scanner = null;

function openScanner(){

    const scannerBox =
        document.getElementById("scanner");

    scannerBox.style.display = "block";

    scannerBox.scrollIntoView({
        behavior:"smooth",
        block:"center"
    });

    if(scanner) return;

    scanner =
        new Html5Qrcode("reader");

    scanner.start(

        {
            facingMode:"environment"
        },

        {
            fps:10,

            qrbox:{
                width:280,
                height:140
            },

            aspectRatio:1.777
        },

        code => {

            if(!scanner) return;

            const currentScanner =
                scanner;

            scanner = null;

            currentScanner.stop()
                .then(() => {

                    currentScanner.clear();

                    scannerBox.style.display =
                        "none";

                    searchProduct(code);

                })
                .catch(() => {

                    scannerBox.style.display =
                        "none";

                    searchProduct(code);

                });

        },

        () => {}

    ).catch(error => {

        console.error(error);

        document.getElementById("reader")
            .innerHTML = `

                <div style="
                    padding:35px 20px;
                    text-align:center;
                    color:#ff5d68;
                    line-height:1.5;
                ">

                    Non riesco ad accedere
                    alla fotocamera.

                    <br><br>

                    Controlla che Safari abbia
                    il permesso di utilizzare
                    la fotocamera.

                </div>

            `;

    });

}


function closeScanner(){

    const scannerBox =
        document.getElementById("scanner");

    if(!scanner){

        scannerBox.style.display =
            "none";

        return;

    }

    const currentScanner =
        scanner;

    scanner = null;

    currentScanner.stop()
        .then(() => {

            currentScanner.clear();

            scannerBox.style.display =
                "none";

        })
        .catch(() => {

            scannerBox.style.display =
                "none";

        });

}


/* =====================================================
   MANUAL
===================================================== */

function manualSearch(){

    const input =
        document.getElementById("barcode");

    const code =
        input.value.trim();

    if(!code) return;

    searchProduct(code);
}


/* =====================================================
   SEARCH PRODUCT
===================================================== */

async function searchProduct(barcode){

    const loading =
        document.getElementById("loading");

    const result =
        document.getElementById("result");

    loading.style.display =
        "block";

    result.innerHTML = "";

    window.scrollTo({
        top:document.body.scrollHeight,
        behavior:"smooth"
    });

    try{

        const response =
            await fetch(
                `https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(barcode)}.json`
            );

        const data =
            await response.json();

        if(
            data.status !== 1 ||
            !data.product
        ){

            throw new Error(
                "Prodotto non trovato."
            );

        }

        showProduct(
            data.product,
            barcode
        );

    }catch(error){

        result.innerHTML = `

            <div class="error">

                <strong>Prodotto non trovato</strong>

                <br><br>

                Non ho trovato informazioni
                sufficienti per questo codice.

                <br><br>

                Puoi provare a controllare
                il codice oppure inserirne
                un altro.

            </div>

        `;

    }finally{

        loading.style.display =
            "none";

    }

}


/* =====================================================
   PRODUCT ANALYSIS
===================================================== */

function showProduct(product, barcode){

    const result =
        document.getElementById("result");

    const name =
        product.product_name_it ||
        product.product_name ||
        "Prodotto senza nome";

    const brand =
        product.brands ||
        "";

    const image =
        product.image_front_url ||
        product.image_url ||
        "";

    const ingredients =
        product.ingredients_text_it ||
        product.ingredients_text ||
        "Informazioni sugli ingredienti non disponibili.";

    const allergens =
        (
            product.allergens_tags ||
            []
        )
        .join(" ")
        .toLowerCase();

    const ingredientsLower =
        ingredients.toLowerCase();

    const milkWords = [

        "lattosio",
        "latte",
        "latte in polvere",
        "siero di latte",
        "proteine del latte",
        "proteine del siero",
        "caseina",
        "caseinato",
        "burro",
        "panna",
        "crema di latte",
        "lactose",
        "milk",
        "whey",
        "casein"

    ];

    const containsMilk =
        milkWords.some(word =>
            ingredientsLower.includes(word)
        ) ||
        allergens.includes("milk");

    const explicitFree =
        ingredientsLower.includes(
            "senza lattosio"
        ) ||
        ingredientsLower.includes(
            "lactose-free"
        );

    let status;

    if(explicitFree){

        status = {

            type:"safe",

            title:"SENZA LATTOSIO",

            text:
            "Il prodotto è indicato come senza lattosio."

        };

    }else if(containsMilk){

        status = {

            type:"danger",

            title:"LATTOSIO / DERIVATI DEL LATTE",

            text:
            "Negli ingredienti o negli allergeni sono presenti riferimenti al latte o a suoi derivati. Controlla sempre l'etichetta sulla confezione."

        };

    }else{

        status = {

            type:"safe",

            title:"NESSUN LATTOSIO RILEVATO",

            text:
            "Negli ingredienti disponibili non sono stati trovati riferimenti evidenti a lattosio o derivati del latte."

        };

    }


    result.innerHTML = `

        <article class="product-card">

            <div class="product-header">

                <div class="product-photo-wrap">

                    ${
                        image
                        ?
                        `<img
                            class="product-photo"
                            src="${escapeAttr(image)}"
                            alt=""
                            onerror="this.style.display='none'">
                        `
                        :
                        `<div
                            class="product-photo placeholder">
                        </div>`
                    }

                </div>

                <div class="product-info">

                    <h2 class="product-name">
                        ${escapeHtml(name)}
                    </h2>

                    ${
                        brand
                        ?
                        `<div class="product-brand">
                            ${escapeHtml(brand)}
                        </div>`
                        :
                        ""
                    }

                </div>

            </div>


            <div class="
                status
                ${status.type}
            ">

                <div class="status-dot"></div>

                <h3 class="status-title">
                    ${status.title}
                </h3>

                <p class="status-text">
                    ${status.text}
                </p>

            </div>


            <div class="details">

                <h3 class="detail-label">
                    Ingredienti
                </h3>

                <div class="ingredients">
                    ${escapeHtml(ingredients)}
                </div>

                <div class="meta">

                    <span>
                        EAN ${escapeHtml(barcode)}
                    </span>

                    <span>
                        Open Food Facts
                    </span>

                </div>

            </div>

        </article>

    `;


    if(containsMilk && !explicitFree){

        showAlternatives(product);

    }

}


/* =====================================================
   ALTERNATIVES
===================================================== */

async function showAlternatives(product){

    const result =
        document.getElementById("result");

    const category =
        product.categories_tags &&
        product.categories_tags.length
        ?
        product.categories_tags[
            product.categories_tags.length - 1
        ]
        :
        null;

    if(!category) return;

    try{

        const url =
            `https://world.openfoodfacts.org/api/v2/search?categories_tags=${encodeURIComponent(category)}&labels_tags_it=senza-lattosio&fields=product_name,brands,image_front_url&size=4`;

        const response =
            await fetch(url);

        const data =
            await response.json();

        const products =
            data.products || [];

        if(!products.length) return;

        const items =
            products
            .filter(p => p.product_name)
            .slice(0,3);

        if(!items.length) return;

        const html =
            items.map(p => `

                <div class="alt-item">

                    <span class="alt-item-name">

                        ${escapeHtml(
                            p.product_name
                        )}

                        ${
                            p.brands
                            ?
                            `<br>
                             <small style="
                                color:#77777f;
                                font-weight:500;
                             ">
                                ${escapeHtml(p.brands)}
                             </small>`
                            :
                            ""
                        }

                    </span>

                    <span class="alt-item-status">
                        SENZA LATTOSIO
                    </span>

                </div>

            `).join("");

        result.insertAdjacentHTML(
            "beforeend",

            `

            <section class="alternative">

                <div class="alternative-head">

                    <div class="alternative-badge">
                        ✓
                    </div>

                    <h3 class="alternative-title">
                        Possibili alternative
                    </h3>

                </div>

                <p class="alternative-description">

                    Ho trovato prodotti della
                    stessa categoria indicati
                    come senza lattosio.

                </p>

                ${html}

            </section>

            `

        );

    }catch(error){

        console.log(
            "Alternative non disponibili",
            error
        );

    }

}


/* =====================================================
   SECURITY / TEXT
===================================================== */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function escapeAttr(value){

    return String(value)
        .replace(/"/g,"&quot;");

}

</script>
